[project]
name = "devworld"
version = "0.1.0"
description = "DevWorld backend: FastAPI API, synthetic provider, history, layout, jobs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.118",
  "uvicorn>=0.30,<0.35",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<0.29",
  "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devworld"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
