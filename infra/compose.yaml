# DevWorld development services (staging-like). Local demo runs without this.
# Loopback-only ports; the private artifact bucket is not a public endpoint.
services:
  db:
    image: postgres:16-alpine
    command: postgres -c max_connections=100
    environment:
      POSTGRES_USER: devworld
      POSTGRES_PASSWORD: devworld
      POSTGRES_DB: devworld
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devworld-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  artifacts:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devworld
      MINIO_ROOT_PASSWORD: devworld-inert-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - devworld-artifacts:/data

volumes:
  devworld-db:
  devworld-artifacts:
